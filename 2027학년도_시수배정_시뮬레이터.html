<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027학년도 시수배정 시뮬레이터</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#1c2333; --sub:#5b6478; --line:#e3e8f0;
  --blue:#2563eb; --blue-bg:#eff4ff; --green:#15803d; --green-bg:#ecfdf3;
  --red:#dc2626; --red-bg:#fef2f2; --amber:#b45309; --amber-bg:#fffbeb;
  --violet:#7c3aed; --violet-bg:#f5f3ff; --teal:#0d9488; --teal-bg:#f0fdfa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
header{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:18px 24px;
  box-shadow:0 2px 10px rgba(30,58,138,.25)}
.hrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;max-width:1400px;margin:0 auto}
header h1{font-size:19px;font-weight:700;letter-spacing:-.3px}
header .sub{font-size:12px;opacity:.85;width:100%}
.spacer{flex:1}
.semtoggle{display:flex;background:#eef2f7;border-radius:9px;padding:3px;align-self:center}
#semtoggle button{border:0;background:transparent;color:var(--sub);font-weight:700;font-size:13px;padding:6px 16px;border-radius:7px;cursor:pointer;border-bottom:0}
#semtoggle button.on{background:var(--blue);color:#fff;border-bottom:0}
.hbtn{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;font-size:12px;
  padding:6px 12px;border-radius:8px;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.22)}
#savestat{font-size:11px;opacity:.8}
nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;
  box-shadow:0 3px 12px rgba(16,24,40,.08)}
.navrow{max-width:1400px;margin:0 auto;display:flex;gap:4px;padding:0 24px}
nav button{border:0;background:transparent;font-size:14px;font-weight:600;color:var(--sub);padding:13px 18px;cursor:pointer;
  border-bottom:2.5px solid transparent}
nav button.on{color:var(--blue);border-bottom-color:var(--blue)}
.groupbar{max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  padding:8px 24px 10px;border-top:1px solid #eef1f6}
.gb-label{font-size:11.5px;font-weight:700;color:var(--sub);margin-right:4px;white-space:nowrap}
.gbtn{border:1px solid var(--line);background:#f8fafc;border-radius:9px;padding:4px 10px;cursor:pointer;
  font-family:inherit;font-size:12px;line-height:1.35;text-align:left;display:inline-flex;gap:7px;align-items:center}
.gbtn:hover{background:var(--blue-bg);border-color:#bfdbfe}
.gbtn b{font-size:12px}
.gbtn .gh{font-variant-numeric:tabular-nums;font-weight:700}
.gbtn .gt{color:var(--sub);font-variant-numeric:tabular-nums}
.gh.ok{color:var(--green)} .gh.mid{color:var(--amber)} .gh.hi{color:var(--red)}
main{max-width:1400px;margin:0 auto;padding:20px 24px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px;
  box-shadow:0 1px 3px rgba(16,24,40,.05)}
.card h2{font-size:16px;font-weight:700;margin-bottom:4px;letter-spacing:-.2px}
.card .desc{font-size:12px;color:var(--sub);margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8fafc;color:var(--sub);font-weight:600;font-size:12px;text-align:left;padding:8px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid #eef1f6;vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.ctr{text-align:center}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.b-blue{background:var(--blue-bg);color:var(--blue)} .b-green{background:var(--green-bg);color:var(--green)}
.b-red{background:var(--red-bg);color:var(--red)} .b-amber{background:var(--amber-bg);color:var(--amber)}
.b-gray{background:#f1f5f9;color:var(--sub)} .b-violet{background:var(--violet-bg);color:var(--violet)}
.b-teal{background:var(--teal-bg);color:var(--teal)}
input[type=number]{width:64px;padding:5px 7px;border:1px solid #cbd5e1;border-radius:7px;font-size:13px;text-align:right;
  font-family:inherit}
input[type=text]{padding:5px 8px;border:1px solid #cbd5e1;border-radius:7px;font-size:13px;font-family:inherit}
select{padding:5px 8px;border:1px solid #cbd5e1;border-radius:7px;font-size:13px;font-family:inherit;background:#fff;max-width:340px}
input:focus,select:focus{outline:2px solid #bfdbfe;border-color:var(--blue)}
.ovr{background:#fef9c3;border-color:#facc15}
.btn{border:0;border-radius:8px;font-size:12.5px;font-weight:600;padding:7px 13px;cursor:pointer;font-family:inherit}
.btn-p{background:var(--blue);color:#fff} .btn-p:hover{background:#1d4ed8}
.btn-s{background:#eef2f7;color:var(--ink)} .btn-s:hover{background:#e2e8f0}
.btn-d{background:transparent;color:var(--red);font-size:14px;padding:2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--blue-bg);color:#1e40af;border:1px solid #d6e2ff;
  font-size:12px;font-weight:500;padding:3px 6px 3px 9px;border-radius:8px}
.chip.nonmajor{background:var(--amber-bg);color:var(--amber);border-color:#fde8c0}
.chip.extra{background:var(--violet-bg);color:var(--violet);border-color:#e6dcff}
.chip .x{cursor:pointer;font-weight:700;opacity:.55;padding:0 2px} .chip .x:hover{opacity:1}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center}
.fchip{border:1px solid var(--line);background:#fff;color:var(--sub);font-size:12.5px;font-weight:600;
  padding:6px 13px;border-radius:99px;cursor:pointer}
.fchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .k{font-size:12px;color:var(--sub);font-weight:600}
.stat .v{font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-.5px}
.stat .m{font-size:11px;color:var(--sub);margin-top:2px}
.grade-h{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.grade-h h3{font-size:14.5px;font-weight:700}
.warnrow{background:var(--red-bg)}
.okrow{background:var(--green-bg)}
.editor{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:14px;margin:4px 0 10px}
.editor h4{font-size:13px;font-weight:700;margin-bottom:8px;color:#334155}
.addrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.hourbar{height:6px;border-radius:99px;background:#e5eaf2;overflow:hidden;min-width:70px}
.hourbar>i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.small{font-size:11.5px;color:var(--sub)}
.tbl-scroll{overflow-x:auto}
.teacher-row{cursor:pointer}
.teacher-row:hover{background:#f8fafc}
.teacher-row.assignable:hover{background:var(--blue-bg);outline:1.5px dashed var(--blue);outline-offset:-1.5px}
.pickgroup{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed #eef1f6}
.pickgroup:last-child{border-bottom:0}
.pickg-label{flex:0 0 92px;font-size:12px;font-weight:700;color:var(--sub);padding-top:5px;line-height:1.3}
.pickg-h{font-size:11px;font-weight:600;color:var(--blue)}
.pick{display:inline-flex;align-items:center;gap:5px;border:1.5px solid #d6e2ff;background:#fff;color:#1e40af;
  font-size:12.5px;font-weight:500;padding:4px 10px;border-radius:9px;cursor:pointer;user-select:none}
.pick:hover{background:var(--blue-bg)}
.pick b{font-variant-numeric:tabular-nums}
.pick.done{border-color:#bbe7c9;background:var(--green-bg);color:var(--green)}
.pick.sel{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.35)}
.pick.sel .small,.pick.sel i{color:#dbe6ff}
.pick i{font-style:normal;color:var(--sub)}
.pickbanner{position:sticky;top:calc(var(--navh,110px) + 8px);z-index:30;background:#fff8e6;border:1.5px solid #f5c94c;border-radius:12px;
  padding:11px 16px;margin-bottom:14px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  box-shadow:0 3px 10px rgba(180,120,0,.12)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--sub);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
footer{max-width:1400px;margin:0 auto;padding:0 24px 40px;font-size:11.5px;color:var(--sub)}
@media print{header,nav,.filters,.addrow,.btn{display:none}}
</style>
</head>

""}],"blocks":[{"id":"b1","grade":1,"name":"창체1 (자율)-상담·사서·보건","hours":9,"defaultGroup":"창체"},{"id":"b2","grade":1,"name":"기타1 (마음밭 가꾸기)-학급별","hours":9,"defaultGroup":"창체"},{"id":"b3","grade":1,"name":"기타2 (책 한권 읽기)-학년별","hours":3,"defaultGroup":"창체"},{"id":"b4","grade":2,"name":"창체2/기타3 (국제이해)-학급별","hours":9,"defaultGroup":"창체"},{"id":"b5","grade":2,"name":"기타4 (민주시민·환경)-학년별","hours":3,"defaultGroup":"창체"},{"id":"b6","grade":3,"name":"창체3 (자율)-영어과","hours":10,"defaultGroup":"창체"},{"id":"b7","grade":3,"name":"기타5 (자기주도학습)-학급별","hours":3,"defaultGroup":"창체"},{"id":"b8","grade":3,"name":"기타6 (진학정보)-학년별","hours":3,"defaultGroup":"창체"},{"id":"b9","grade":3,"name":"직업반 창체4 (자율)","hours":1,"defaultGroup":"창체"},{"id":"b10","grade":3,"name":"직업반 창체5 (진로)","hours":1,"defaultGroup":"창체"}]};
const LS_KEY = 'sisu2027_v3';
const BASE_GROUPS = ['국어','수학','영어','과학','사회','예체','제2외/한문','정보','교양','창체','기타'];
let GROUPS = [];

/* ---------- state ---------- */
let state = load() || freshState();
function freshState(){
  return {
    capacity: DATA.defaultCapacity,
    sem: 1,
    tab: 'subjects',
    teacherFilter: '전체',
    openTeacher: null,
    pickSubject: null,
    showAllGroups: true,
    teachers: DATA.teachers.map(t=>({...t})),   // 편집 가능한 교사 명단
    subjects: DATA.subjects.map(s=>({...s})),   // 편집 가능한 과목
    blocks: DATA.blocks.map(b=>({...b, group:b.defaultGroup, sem:(b.sem!=null?b.sem:0)})),   // 창체·기타 편성 블록 (sem 0=연간)
    subjGroupOverride: {},    // subjectId -> 거시편성에서 재배치된 교과군
    macroTarget: null,        // 거시편성 기준 1인 시수(null=자동)
    capacity2: DATA.defaultCapacity,
    secOverride: {},          // subjectId -> 분반수
    assignments: [],          // {id, teacherId, subjectId, sections}
    extras: DATA.extrasSeed.map(x => ({id:'e'+x.id, teacherId:x.teacherId, name:x.name,
      hours:x.hours, sem:0, note:x.reason||''})),   // sem 0 = 연간(1·2학기 공통)
    nextId: 1,
    nextTid: 1,
    nextSid: 1,
    nextBid: 1
  };
}
function load(){
  try{ const s = JSON.parse(localStorage.getItem(LS_KEY)); if(!(s && s.assignments)) return null;
    if(!s.teachers) s.teachers = DATA.teachers.map(t=>({...t}));   // 구버전 호환
    if(!s.subjects) s.subjects = DATA.subjects.map(x=>({...x}));
    if(!s.blocks) s.blocks = DATA.blocks.map(b=>({...b, group:b.defaultGroup, sem:(b.sem!=null?b.sem:0)}));
    s.blocks.forEach(b=>{ if(b.sem==null) b.sem=0; });
    if(!s.subjGroupOverride) s.subjGroupOverride = {};
    if(s.macroTarget===undefined) s.macroTarget = null;
    if(s.nextTid==null) s.nextTid = 1;
    if(s.nextSid==null) s.nextSid = 1;
    if(s.nextBid==null) s.nextBid = 1;
    return s;
  } catch(e){ return null; }
}
let saveTimer=null;
function save(){
  localStorage.setItem(LS_KEY, JSON.stringify(state));
  const el=document.getElementById('savestat');
  el.textContent='✓ 저장됨 '+new Date().toLocaleTimeString('ko-KR');
  clearTimeout(saveTimer); saveTimer=setTimeout(()=>el.textContent='',4000);
}

/* ---------- helpers ---------- */
let subjById = {};
let tById = {};
function reindexTeachers(){
  tById = {}; state.teachers.forEach(t=>tById[t.id]=t);
  subjById = {}; state.subjects.forEach(s=>subjById[s.id]=s);
  const present = new Set(state.teachers.map(t=>t.group));
  GROUPS = BASE_GROUPS.filter(g=>present.has(g)).concat([...present].filter(g=>!BASE_GROUPS.includes(g)));
  if(state.teacherFilter!=='전체' && !present.has(state.teacherFilter)) state.teacherFilter='전체';
}
// 과목의 실효 교과군 (거시편성 재배치 반영)
function effGroup(s){ return state.subjGroupOverride[s.id] || s.tGroup; }
// 표시 대상 전체 교과군: 교사·과목·블록 중 하나라도 있는 그룹
function allGroups(){
  const present=new Set();
  state.teachers.forEach(t=>{ if(t.group) present.add(t.group); });
  state.subjects.forEach(s=>{ const g=effGroup(s); if(g && g!=='__none__') present.add(g); });
  state.blocks.forEach(b=>{ if(b.group && b.group!=='__none__') present.add(b.group); });
  return BASE_GROUPS.filter(g=>present.has(g)).concat([...present].filter(g=>!BASE_GROUPS.includes(g)));
}
// 교과군 g의 sem학기 필요시수 (과목 + 창체·기타 블록)
function groupReqHours(g, sem){
  let h=0;
  state.subjects.forEach(s=>{ if(s.sem===sem && effGroup(s)===g) h+=reqHours(s); });
  state.blocks.forEach(b=>{ if(b.group===g && (b.sem===0||b.sem===sem)) h+=b.hours; });
  return h;
}
// 공용 교과군 선택 드롭다운 (미집계 포함)
function groupSelectHTML(cur, onchange){
  const none = !cur || cur==='__none__';
  const opts=BASE_GROUPS.map(g=>`<option value="${g}" ${cur===g?'selected':''}>${g}</option>`).join('')
    +`<option value="__none__" ${none?'selected':''}>(미집계)</option>`;
  return `<select onchange="${onchange}">${opts}</select>`;
}

function sections(s){
  if(state.secOverride[s.id]!=null) return state.secOverride[s.id];
  return autoSections(s);
}
function autoSections(s){
  if(s.kind==='지정') return s.classes!=null ? s.classes : DATA.classCount;
  return Math.max(1, Math.ceil((s.count||0)/state.capacity));
}
function reqHours(s){ return s.credit*sections(s); }
function assignedSections(sid){
  return state.assignments.filter(a=>a.subjectId===sid).reduce((t,a)=>t+a.sections,0);
}
function subjLabel(s, withGrade=true){
  const g = withGrade ? s.grade+'학년 ' : '';
  const grp = s.kind==='선택' ? '['+s.selGroup+'] ' : '[지정] ';
  return g+grp+s.name;
}
function teacherSemHours(t, sem){
  let major=0, non=0, liberal=0, extra=0;
  state.assignments.filter(a=>a.teacherId===t.id).forEach(a=>{
    const s=subjById[a.subjectId]; if(!s || s.sem!==sem) return;
    const h=a.sections*s.credit;
    const eg=effGroup(s);
    if(eg==='교양'||eg==='창체') liberal+=h;
    else if(eg===t.group) major+=h;
    else non+=h;
  });
  state.extras.filter(x=>x.teacherId===t.id && (x.sem===0||x.sem===sem)).forEach(x=>extra+=x.hours);
  return {major, non, liberal, extra, total: major+non+liberal+extra};
}
function esc(x){ return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---------- group status bar (모든 탭 상단 고정) ---------- */
function renderGroupBar(){
  const sem=state.sem;
  const groups = allGroups();
  let html=`<span class="gb-label">📊 ${sem}학기<br>교과군 현황</span>`;
  for(const g of groups){
    const req = groupReqHours(g, sem);
    const tc = state.teachers.filter(t=>t.group===g).length;
    const avg = tc ? req/tc : 0;
    const lv = tc===0 ? (req>0?'hi':'') : (avg>=17?'hi':(avg>=15?'mid':'ok'));
    html+=`<button class="gbtn" onclick="app.gotoGroup('${g}')"
      title="${g} · ${sem}학기 필요시수 ${req}시간 ÷ 교사 ${tc}명${tc?' = 1인 평균 '+avg.toFixed(1)+'시간':' (교사 없음)'} (클릭 시 교사 배정으로 이동)">
      <b>${g}</b><span class="gh ${lv}">${req}h</span><span class="gt">${tc}명${tc?'·'+avg.toFixed(1):''}</span>
    </button>`;
  }
  document.getElementById('groupbar').innerHTML=html;
}

/* ---------- render root ---------- */
function render(){
  reindexTeachers();
  renderGroupBar();
  requestAnimationFrame(()=>{
    const nav=document.querySelector('nav');
    if(nav) document.documentElement.style.setProperty('--navh', nav.offsetHeight+'px');
  });
  document.querySelectorAll('#semtoggle button').forEach(b=>b.classList.toggle('on', +b.dataset.sem===state.sem));
  document.querySelectorAll('nav button[data-tab]').forEach(b=>b.classList.toggle('on', b.dataset.tab===state.tab));
  ['subjects','teachers','summary','macro'].forEach(t=>{
    document.getElementById('tab-'+t).style.display = state.tab===t?'':'none';
  });
  if(state.tab==='subjects') renderSubjects();
  if(state.tab==='teachers') renderTeachers();
  if(state.tab==='summary') renderSummary();
  if(state.tab==='macro') renderMacro();
}

/* ---------- tab 1: subjects ---------- */

        onchange="app.setCapacity(this.value)"></label>
      <span class="small">분반수 = ⌈신청인원 ÷ 정원⌉ (노란 입력칸은 수동 조정된 값 · 비우면 자동값으로 복귀)</span>

    <div class="tbl-scroll"><table>
    <tr><th>구분</th><th>과목명</th><th>교과군</th><th class="ctr">학점<br>(주당)</th><th class="num">신청<br>인원</th>
    <th class="ctr">분반수</th><th class="num">분반당<br>인원</th><th class="num">필요시수</th>
    <th class="num">배정분반</th><th class="num">배정시수</th><th class="ctr">상태</th><th class="ctr">관리</th></tr>`;

    for(const s of list){

      const per = s.count!=null && sec>0 ? (s.count/sec).toFixed(1) : '–';
      const ovr = state.secOverride[s.id]!=null;
      const eg=effGroup(s), moved=eg!==s.tGroup;
      let stat;
      if(asec===sec) stat='<span class="badge b-green">완료</span>';
      else if(asec>sec) stat='<span class="badge b-amber">초과 +'+(asec-sec)+'</span>';
      else if(asec>0) stat='<span class="badge b-amber">'+(sec-asec)+'분반 남음</span>';
      else stat='<span class="badge b-red">미배정</span>';
      html+=`<tr>
        <td>${s.kind==='선택'?'<span class="badge b-violet">그룹'+(s.selGroup||'선택')+'</span>':'<span class="badge b-gray">지정</span>'}</td>
        <td><b>${esc(s.name)}</b></td>
        <td><span class="small">${esc(s.kwGroup)}</span> <span class="badge b-teal">${eg}</span>${moved?' <span class="small">(원래 '+s.tGroup+')</span>':''}</td>

        <td class="ctr"><input type="number" min="0" max="30" class="${ovr?'ovr':''}" value="${sec}"

          <button class="btn btn-s" style="padding:4px 8px;color:var(--red)" onclick="app.deleteSubject('${s.id}')" title="삭제">🗑</button></td></tr>`;
      if(state.editSubject===s.id) html+=`<tr><td colspan="12">${subjectEditor(s)}</td></tr>`;
    }
    html+='</table></div>';

    // 창체·기타 (창의적 체험활동) — 학년·학기별
    const blks = state.blocks.filter(b=>b.grade===grade && (b.sem===0||b.sem===sem));
    const bhr = blks.reduce((t,b)=>t+b.hours,0);
    html+=`<div style="margin-top:16px"><div class="grade-h">
      <h4 style="font-size:13.5px;font-weight:700">🧩 창체·기타 (창의적 체험활동)</h4>
      <span class="badge b-violet">${grade}학년 ${sem}학기 ${bhr}시간</span>
      <span class="small">편성 교과군은 ④거시편성과 연동됩니다</span>
      <button class="btn btn-p" style="margin-left:auto" onclick="app.addBlock(${grade},${sem})">＋ 창체 추가</button>
    </div>
    <div class="tbl-scroll"><table>
    <tr><th>블록명</th><th class="num">시수</th><th class="ctr">적용</th><th>편성 교과군</th><th class="ctr">관리</th></tr>`;
    if(!blks.length) html+='<tr><td colspan="5" class="small">등록된 창체·기타 블록이 없습니다. <b>＋ 창체 추가</b>로 등록하세요.</td></tr>';
    for(const b of blks){
      html+=`<tr>
        <td><input type="text" value="${esc(b.name)}" onchange="app.setBlockName('${b.id}',this.value)" style="width:260px"></td>
        <td class="num"><input type="number" min="0" max="40" value="${b.hours}" onchange="app.setBlockHours('${b.id}',this.value)"></td>
        <td class="ctr"><select onchange="app.setBlockSem('${b.id}',this.value)">
          <option value="0" ${b.sem===0?'selected':''}>연간</option>
          <option value="1" ${b.sem===1?'selected':''}>1학기</option>
          <option value="2" ${b.sem===2?'selected':''}>2학기</option></select></td>
        <td>${groupSelectHTML(b.group, `app.setBlockGroup('${b.id}',this.value)`)}</td>
        <td class="ctr"><button class="btn btn-s" style="padding:4px 8px;color:var(--red)" onclick="app.deleteBlock('${b.id}')" title="삭제">🗑</button></td></tr>`;
    }
    html+='</table></div></div></div>';
  }
  document.getElementById('tab-subjects').innerHTML=html;
}

    <h4>✏️ 과목 수정</h4>
    <div class="addrow">
      <label>과목명 <input type="text" id="es-name-${s.id}" value="${esc(s.name)}" style="width:150px"></label>
      <label>교과군 <select id="es-grp-${s.id}">${grpOpts}</select></label>
      <label>학점 <input type="number" id="es-cr-${s.id}" min="1" max="8" step="0.5" value="${s.credit}"></label>
      <label>구분 <select id="es-kind-${s.id}"><option value="지정" ${s.kind==='지정'?'selected':''}>지정(전교생)</option><option value="선택" ${s.kind==='선택'?'selected':''}>선택</option></select></label>
      <label>신청인원 <input type="number" id="es-cnt-${s.id}" min="0" value="${s.count!=null?s.count:0}"></label>

      <label>학년 <select id="es-gr-${s.id}">${[1,2,3].map(g=>`<option value="${g}" ${s.grade===g?'selected':''}>${g}</option>`).join('')}</select></label>
      <label>학기 <select id="es-sem-${s.id}">${[1,2].map(m=>`<option value="${m}" ${s.sem===m?'selected':''}>${m}</option>`).join('')}</select></label>

  </div>`;
}

/* ---------- tab 2: teachers ---------- */
function renderTeachers(){
  const sem=state.sem;
  const picked = state.pickSubject ? subjById[state.pickSubject] : null;
  if(picked && picked.sem!==sem) { state.pickSubject=null; }
  const picked2 = state.pickSubject ? subjById[state.pickSubject] : null;

  // ---- 과목 중심 배정 패널: 교과군별 개설 과목 ----
  const collapsed = picked2 && !state.showAllGroups;
  let html=`<div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <h2 style="margin:0">🎯 과목 중심 배정 — ${sem}학기 개설 과목</h2>`;
  if(picked2){
    html+= collapsed
      ? `<span class="badge b-blue">${picked2.tGroup} 교과군만 표시 중</span>
         <button class="btn btn-s" onclick="app.toggleGroups()">▾ 전체 교과군 복원</button>`
      : `<button class="btn btn-s" onclick="app.toggleGroups()">▴ ${picked2.tGroup} 교과군만 보기</button>`;
  }
  html+=`</div>
    <div class="desc">① 아래에서 과목을 클릭해 선택 → ② 교사 표에서 담당할 교사를 클릭하면 <b>1분반씩</b> 배정됩니다.
    같은 과목을 다시 클릭하면 선택이 해제됩니다. (과목 선택 시 해당 교과군 교사로 자동 필터링)</div>`;
  let tgOrder=allGroups().filter(g=>state.subjects.some(s=>s.sem===sem&&effGroup(s)===g));
  if(collapsed) tgOrder = tgOrder.filter(g=>g===effGroup(picked2));
  for(const g of tgOrder){
    const subs=state.subjects.filter(s=>s.sem===sem&&effGroup(s)===g);
    const greq=groupReqHours(g, sem);
    const gtc=state.teachers.filter(t=>t.group===g).length;
    html+=`<div class="pickgroup"><span class="pickg-label">${g}<br><span class="pickg-h">(${greq}시간 / ${gtc}명)</span></span><div class="chips">`;
    for(const s of subs){
      const sec=sections(s), asec=assignedSections(s.id), rem=sec-asec;
      const cls = state.pickSubject===s.id?'sel':(rem<=0?'done':'');
      const who = state.assignments.filter(a=>a.subjectId===s.id).map(a=>(tById[a.teacherId]?tById[a.teacherId].name:'?')+'×'+a.sections).join(', ');
      html+=`<span class="pick ${cls}" onclick="app.pickSubj('${s.id}')"
        title="${esc(s.kwGroup)} · ${s.count!=null?('신청 '+s.count+'명'):'전교생'}${who?' · 배정: '+esc(who):''}">
        ${s.grade}학년 ${s.kind==='선택'?'['+s.selGroup+']':'[지정]'} ${esc(s.name)}
        <b>${asec}/${sec}</b><i class="small">·${s.credit}학점</i></span>`;
    }
    html+='</div></div>';
  }
  html+='</div>';

  if(picked2){
    const sec=sections(picked2), asec=assignedSections(picked2.id);
    html+=`<div class="pickbanner">📌 <b>${esc(subjLabel(picked2))}</b> (${picked2.credit}학점 · 배정 ${asec}/${sec}분반)
      — 아래 교사 이름을 클릭하면 1분반(${picked2.credit}시간)씩 배정됩니다.
      <button class="btn btn-s" onclick="app.pickSubj('${picked2.id}')">선택 해제</button></div>`;
  }

  html+=`<div class="filters">${['전체',...GROUPS].map(g=>
    `<button class="fchip ${state.teacherFilter===g?'on':''}" onclick="app.setFilter('${g}')">${g} <span class="small">${state.teachers.filter(t=>t.group===g).length}</span></button>`).join('')}
    <button class="btn btn-p" style="margin-left:8px" onclick="app.addTeacher()">＋ 교사 추가</button>
    <span class="small" style="margin-left:auto">${picked2?'과목 선택 중: 교사 클릭 = 배정':'교사 행 클릭=배정편집 · ✎=정보수정/삭제'} 현재 <b>${sem}학기</b></span>
  </div><div class="card"><div class="tbl-scroll"><table>
  <tr><th>교과군</th><th>이름</th><th>비고</th><th style="min-width:300px">배정 내역 (${sem}학기 + 연간기타)</th>
  <th class="num">1학기</th><th class="num">2학기</th><th class="ctr">부담</th><th class="ctr">관리</th></tr>`;
  const teachers = state.teachers.filter(t=>state.teacherFilter==='전체'||t.group===state.teacherFilter);
  if(!teachers.length) html+=`<tr><td colspan="8" class="ctr small">해당 교과군에 등록된 교사가 없습니다. 위 <b>＋ 교사 추가</b> 버튼으로 등록하세요.</td></tr>`;
  for(const t of teachers){
    const h1=teacherSemHours(t,1), h2=teacherSemHours(t,2);
    const cur = sem===1?h1:h2;
    const chips=[];
    state.assignments.filter(a=>a.teacherId===t.id).forEach(a=>{
      const s=subjById[a.subjectId]; if(!s || s.sem!==sem) return;
      const eg=effGroup(s);
      const cls = eg===t.group?'':((eg==='교양'||eg==='창체')?'extra':'nonmajor');
      chips.push(`<span class="chip ${cls}" title="${eg===t.group?'전공':((eg==='교양'||eg==='창체')?eg:'비전공')}">
        ${esc(subjLabel(s))} ×${a.sections} <b>${a.sections*s.credit}h</b>
        <span class="x" onclick="event.stopPropagation();app.removeAssign('${a.id}')">×</span></span>`);
    });
    state.extras.filter(x=>x.teacherId===t.id && (x.sem===0||x.sem===sem)).forEach(x=>{
      chips.push(`<span class="chip extra" title="기타/창체">${esc(x.name)} <b>${x.hours}h</b>
        <span class="x" onclick="event.stopPropagation();app.removeExtra('${x.id}')">×</span></span>`);
    });
    const maxSem=Math.max(h1.total,h2.total);
    const warn = maxSem>=20?'b-red':(maxSem>=17?'b-amber':'b-green');
    html+=`<tr class="teacher-row ${picked2?'assignable':''}" onclick="app.rowClick('${t.id}')">
      <td><span class="badge b-gray">${t.group}</span></td>
      <td><b>${esc(t.name)}</b></td>
      <td class="small">${esc(t.note||'')}</td>
      <td><div class="chips">${chips.join('')||'<span class="small">배정 없음</span>'}</div></td>
      <td class="num ${sem===1?'':'small'}"><b>${h1.total}</b></td>
      <td class="num ${sem===2?'':'small'}"><b>${h2.total}</b></td>
      <td class="ctr"><span class="badge ${warn}">${maxSem}h</span></td>
      <td class="ctr"><button class="btn btn-s" style="padding:4px 9px" onclick="event.stopPropagation();app.editTeacher('${t.id}')" title="교사 정보 수정/삭제">✎</button></td></tr>`;
    if(state.openTeacher===t.id) html+=`<tr><td colspan="8">${teacherEditor(t)}</td></tr>`;
  }
  html+=`</table></div>
  <div class="legend">
    <span><i style="background:#dbeafe"></i>전공 과목</span>
    <span><i style="background:#fde8c0"></i>비전공 과목</span>
    <span><i style="background:#e6dcff"></i>교양·기타/창체</span>
    <span>부담 배지: 학기 최대시수 기준 <b style="color:var(--green)">~16h</b> / <b style="color:var(--amber)">17~19h</b> / <b style="color:var(--red)">20h~</b></span>
  </div></div>`;
  document.getElementById('tab-teachers').innerHTML=html;
}

function teacherEditor(t){
  const sem=state.sem;
  // subject options: current semester, remaining first, major group first
  const opts = state.subjects.filter(s=>s.sem===sem).map(s=>{
    const rem = sections(s)-assignedSections(s.id);
    return {s, rem, pri: (effGroup(s)===t.group?0:1)};
  }).sort((a,b)=> a.pri-b.pri || (b.rem>0)-(a.rem>0) || a.s.grade-b.s.grade);
  const optHtml = opts.map(o=>`<option value="${o.s.id}">${o.pri?'〔타교과〕':''}${subjLabel(o.s)} · ${o.s.credit}학점 · 잔여 ${o.rem}/${sections(o.s)}분반</option>`).join('');

      <td class="num">${a.sections*s.credit}h</td>

  let xrows='';

      <td><button class="btn btn-d" onclick="app.removeExtra('${x.id}')">삭제</button></td></tr>`;

      <label>이름 <input type="text" id="tn-${t.id}" value="${esc(t.name)}" style="width:110px"></label>

      <label>비고 <input type="text" id="tnote-${t.id}" value="${esc(t.note||'')}" placeholder="예: 교무부장" style="width:160px"></label>
      <button class="btn btn-p" onclick="app.saveTeacher('${t.id}')">정보 저장</button>
      <button class="btn btn-d" style="border:1px solid var(--red);margin-left:auto" onclick="app.deleteTeacher('${t.id}')">🗑 교사 삭제${acount?' (배정 '+acount+'건)':''}</button>
    </div>
    <h4 style="margin-top:14px">✏️ ${esc(t.name)} (${t.group}) — 배정 편집</h4>
    <table><tr><th>학기</th><th>과목</th><th class="ctr">분반수</th><th class="num">시수</th><th></th></tr>
      ${rows||'<tr><td colspan="5" class="small">교과 배정 없음</td></tr>'}</table>
    <div class="addrow">
      <select id="addsub-${t.id}">${optHtml}</select>
      <input type="number" id="addsec-${t.id}" min="1" max="20" value="1"> 분반
      <button class="btn btn-p" onclick="app.addAssign('${t.id}')">＋ ${sem}학기 과목 배정</button>
    </div>
    <h4 style="margin-top:14px">🎯 기타·창체 시수</h4>
    <table><tr><th>적용</th><th>명칭</th><th class="ctr">시수</th><th class="num"></th><th></th></tr>
      ${xrows||'<tr><td colspan="5" class="small">기타 시수 없음</td></tr>'}</table>
    <div class="addrow">
      <input type="text" id="addxname-${t.id}" placeholder="예: 창체(자율), 국제이해, 진학정보" style="width:220px">

      <button class="btn btn-p" onclick="app.addExtra('${t.id}')">＋ 기타 시수 추가</button>
    </div>
  </div>`;
}

/* ---------- tab 3: summary ---------- */
function renderSummary(){
  let html='';
  // top stats per semester
  for(const sem of [1,2]){
    const subs = state.subjects.filter(s=>s.sem===sem);
    const req = subs.reduce((t,s)=>t+reqHours(s),0);
    const asn = subs.reduce((t,s)=>t+Math.min(assignedSections(s.id),sections(s))*s.credit,0);
    const extra = state.extras.filter(x=>x.teacherId&&(x.sem===0||x.sem===sem)).reduce((t,x)=>t+x.hours,0);
    const activeT = state.teachers.filter(t=>teacherSemHours(t,sem).total>0).length;
    const totalAll = state.teachers.reduce((t,x)=>t+teacherSemHours(x,sem).total,0);
    html+=`<div class="card"><h2>${sem}학기 현황</h2><div class="statgrid">
      <div class="stat"><div class="k">교과 필요시수</div><div class="v">${req}h</div><div class="m">분반 기준 주당 합계</div></div>
      <div class="stat"><div class="k">교과 배정시수</div><div class="v">${asn}h</div>
        <div class="m">배정률 ${req?Math.round(asn/req*100):0}%</div>
        <div class="hourbar" style="margin-top:6px"><i style="width:${req?Math.min(100,asn/req*100):0}%"></i></div></div>
      <div class="stat"><div class="k">기타·창체 배정</div><div class="v">${extra}h</div><div class="m">교사 지정된 항목 합</div></div>
      <div class="stat"><div class="k">교사 총 배정</div><div class="v">${totalAll}h</div><div class="m">배정 교사 ${activeT}/${state.teachers.length}명 · 평균 ${activeT?(totalAll/activeT).toFixed(1):0}h</div></div>
    </div>`;
    // incomplete subjects
    const bad = subs.filter(s=>assignedSections(s.id)!==sections(s));
    if(bad.length){
      html+=`<div class="desc" style="margin-top:2px">⚠️ 분반 배정이 완료되지 않은 과목 <b>${bad.length}</b>개</div>
      <div class="chips">`+bad.map(s=>{
        const d=assignedSections(s.id)-sections(s);
        return `<span class="chip ${d<0?'nonmajor':''}">${esc(subjLabel(s))} ${d>0?'+'+d:d}분반</span>`;
      }).join('')+'</div>';
    } else {
      html+='<div class="desc">✅ 모든 과목의 분반 배정 완료</div>';
    }
    html+='</div>';
  }
  // by teacher group
  html+='<div class="card"><h2>교과군별 필요 vs 배정 (교과 시수)</h2>'
    +'<div class="desc">창체·기타 블록은 거시편성에서 배치한 교과군에 포함됩니다.</div>'
    +'<div class="tbl-scroll"><table><tr><th>교과담당군</th>';
  for(const sem of [1,2]) html+=`<th class="num">${sem}학기 필요</th><th class="num">${sem}학기 배정</th><th class="ctr">${sem}학기 상태</th>`;
  html+='</tr>';
  for(const g of allGroups()){
    html+=`<tr><td><b>${g}</b></td>`;
    for(const sem of [1,2]){
      const req=groupReqHours(g, sem);
      const subs=state.subjects.filter(s=>effGroup(s)===g&&s.sem===sem);
      const bh=state.blocks.filter(b=>b.group===g).reduce((t,b)=>t+b.hours,0);
      const asn=subs.reduce((t,s)=>t+assignedSections(s.id)*s.credit,0)+bh;
      const ok=req===asn;
      html+=`<td class="num">${req}</td><td class="num">${asn}</td>
        <td class="ctr"><span class="badge ${ok?'b-green':(asn>req?'b-amber':'b-red')}">${ok?'완료':(asn-req>0?'+':'')+(asn-req)+'h'}</span></td>`;
    }
    html+='</tr>';
  }
  html+='</table></div></div>';
  // teacher totals
  html+=`<div class="card"><h2>교사별 배정시수 총괄</h2>
    <div class="desc">전공/비전공은 과목의 교과담당군과 교사의 교과군 일치 여부로 구분 · 교양군 과목은 교양시수로 집계</div>
    <div class="tbl-scroll"><table>
    <tr><th>교과군</th><th>이름</th><th>비고</th>
      <th class="num">1학기 전공</th><th class="num">비전공</th><th class="num">교양</th><th class="num">기타</th><th class="num"><b>1학기 계</b></th>
      <th class="num">2학기 전공</th><th class="num">비전공</th><th class="num">교양</th><th class="num">기타</th><th class="num"><b>2학기 계</b></th></tr>`;
  for(const t of state.teachers){
    const h1=teacherSemHours(t,1), h2=teacherSemHours(t,2);
    const cls = Math.max(h1.total,h2.total)>=20?'warnrow':'';
    html+=`<tr class="${cls}"><td><span class="badge b-gray">${t.group}</span></td><td><b>${esc(t.name)}</b></td>
      <td class="small">${esc(t.note||'')}</td>
      <td class="num">${h1.major||''}</td><td class="num">${h1.non||''}</td><td class="num">${h1.liberal||''}</td><td class="num">${h1.extra||''}</td><td class="num"><b>${h1.total}</b></td>
      <td class="num">${h2.major||''}</td><td class="num">${h2.non||''}</td><td class="num">${h2.liberal||''}</td><td class="num">${h2.extra||''}</td><td class="num"><b>${h2.total}</b></td></tr>`;
  }
  html+='</table></div></div>';
  document.getElementById('tab-summary').innerHTML=html;
}

/* ---------- tab 4: 거시편성 (macro planning) ---------- */
const DEPT_EXCLUDE=['교양','창체','기타'];
const REAL_DEPTS=BASE_GROUPS.filter(g=>!DEPT_EXCLUDE.includes(g));
// 교과군 g의 sem학기 배정시수를 전공/교양/창체로 분리
function deptHours(g, sem){
  let major=0, lib=0, ch=0;
  state.subjects.forEach(s=>{
    if(s.sem===sem && effGroup(s)===g){
      if(s.tGroup==='교양') lib+=reqHours(s); else major+=reqHours(s);
    }
  });
  state.blocks.forEach(b=>{ if(b.group===g && (b.sem===0||b.sem===sem)) ch+=b.hours; });
  return {major, lib, ch, total: major+lib+ch};
}
function renderMacro(){
  const groups=allGroups().filter(g=>!DEPT_EXCLUDE.includes(g));
  const rows=groups.map(g=>({
    g,
    tc: state.teachers.filter(t=>t.group===g).length,
    s1: deptHours(g,1),
    s2: deptHours(g,2)
  }));
  const totT=rows.reduce((a,r)=>a+r.tc,0);
  const tot1=rows.reduce((a,r)=>a+r.s1.total,0), tot2=rows.reduce((a,r)=>a+r.s2.total,0);
  const auto1 = totT? tot1/totT : 16, auto2 = totT? tot2/totT : 16;
  const manual = state.macroTarget;
  const t1 = manual!=null ? manual : auto1;
  const t2 = manual!=null ? manual : auto2;

  // 미배정 교양·창체(실교과군에 배정되지 않은 시수)
  const unLib=sem=>state.subjects.filter(s=>s.sem===sem && s.tGroup==='교양' && !REAL_DEPTS.includes(effGroup(s))).reduce((t,s)=>t+reqHours(s),0);
  const unCh=sem=>state.blocks.filter(b=>!REAL_DEPTS.includes(b.group) && (b.sem===0||b.sem===sem)).reduce((t,b)=>t+b.hours,0);

  // 학기별 권장/증감/균형 계산
  const semCells=(h,tc,target)=>{
    const avg = tc? h/tc : 0;
    const dev = target? (avg-target)/target : 0;
    const rec = target? Math.round(h/target) : tc;
    const delta = rec - tc;
    let bal, balc;
    if(tc===0 && h>0){ bal='교사 없음'; balc='b-red'; }
    else if(tc===0){ bal='–'; balc='b-gray'; }
    else if(Math.abs(dev)<0.15){ bal='적정'; balc='b-green'; }
    else if(dev>0){ bal='과다 +'+Math.round(dev*100)+'%'; balc='b-red'; }
    else { bal='여유 '+Math.round(dev*100)+'%'; balc='b-amber'; }
    let dtxt, dcls;
    if(delta>0){ dtxt='＋'+delta+'명'; dcls='b-red'; }
    else if(delta<0){ dtxt=delta+'명'; dcls='b-amber'; }
    else { dtxt='유지'; dcls='b-gray'; }
    const hi=(tc===0&&h>0)||Math.abs(dev)>=0.15;
    return {avg, rec, bal, balc, dtxt, dcls, hi};
  };
  const sub=(v)=> v?`<span class="small">${v}</span>`:'<span class="small" style="opacity:.4">0</span>';

  let html=`<div class="card"><h2>🗺️ 거시편성 — 교과군별 시수·교사 균형</h2>
    <div class="desc">교양·창체는 별도 교과군이 아니라 각 교과군의 <b>배정시수(전공·교양·창체)</b>로 나누어 집계됩니다.
    권장 교사수·증감은 <b>1학기·2학기 각각</b> 계산되며(권장 = 학기 계 ÷ 기준 1인 시수), 편차 15% 이상인 교과군은 강조됩니다.
    아래에서 창체·교양을 각 교과군에 배정하면 해당 교과군의 창체·교양시수로 반영됩니다.</div>
    <div class="addrow">
      <label>기준 1인 시수 <input type="number" min="8" max="25" step="0.5" value="${manual!=null?manual:''}" placeholder="자동" onchange="app.setMacroTarget(this.value)"></label>
      <button class="btn btn-s" onclick="app.setMacroTarget('')">자동(1학기 ${auto1.toFixed(1)} · 2학기 ${auto2.toFixed(1)})</button>
      <span class="small">${manual!=null?'수동 기준 '+manual+'시간 적용 중':'각 학기 전체 평균을 기준으로 사용'}</span>
    </div>
    <div class="tbl-scroll" style="margin-top:10px"><table>
    <tr><th rowspan="2">교과군</th><th rowspan="2" class="num">교사수</th>
      <th colspan="7" class="ctr" style="border-left:2px solid var(--line)">1학기 (기준 ${t1.toFixed(1)})</th>
      <th colspan="7" class="ctr" style="border-left:2px solid var(--line)">2학기 (기준 ${t2.toFixed(1)})</th></tr>
    <tr>${['1','2'].map(()=>`<th class="num" style="border-left:2px solid var(--line)">전공</th><th class="num">교양</th><th class="num">창체</th><th class="num">계</th><th class="num">1인<br>평균</th><th class="num">권장</th><th class="ctr">증감</th>`).join('')}</tr>`;
  const bl='style="border-left:2px solid var(--line)"';
  const semGroup=(d,c,tc)=>`
      <td class="num" ${bl}>${sub(d.major)}</td><td class="num">${sub(d.lib)}</td><td class="num">${sub(d.ch)}</td>
      <td class="num"><b>${d.total}</b></td><td class="num">${tc?c.avg.toFixed(1):'–'}</td>
      <td class="num"><b>${c.rec}</b></td><td class="ctr"><span class="badge ${c.dcls}" title="${c.bal}">${c.dtxt}</span></td>`;
  for(const r of rows){
    const c1=semCells(r.s1.total,r.tc,t1), c2=semCells(r.s2.total,r.tc,t2);
    const majorCnt=state.subjects.filter(s=>effGroup(s)===r.g && s.tGroup!=='교양').length;
    const blockCnt=state.blocks.filter(b=>b.group===r.g).length
      + state.subjects.filter(s=>effGroup(s)===r.g && s.tGroup==='교양').length;
    html+=`<tr class="${c1.hi||c2.hi?'warnrow':''}">
      <td><b>${r.g}</b> <span class="small">${majorCnt}과목${blockCnt?' + '+blockCnt+'블록':''}</span></td>
      <td class="num">${r.tc}</td>
      ${semGroup(r.s1,c1,r.tc)}
      ${semGroup(r.s2,c2,r.tc)}</tr>`;
  }
  const sumG=(sem,tot)=>{
    const mj=rows.reduce((a,r)=>a+r['s'+sem].major,0), lb=rows.reduce((a,r)=>a+r['s'+sem].lib,0), ch=rows.reduce((a,r)=>a+r['s'+sem].ch,0);
    return `<td class="num" ${bl}>${sub(mj)}</td><td class="num">${sub(lb)}</td><td class="num">${sub(ch)}</td>
      <td class="num"><b>${tot}</b></td><td class="num">${totT?(tot/totT).toFixed(1):'–'}</td><td colspan="2"></td>`;
  };
  html+=`<tr style="border-top:2px solid var(--line)"><td><b>합계</b></td><td class="num">${totT}</td>
    ${sumG(1,tot1)}${sumG(2,tot2)}</tr>`;
  html+='</table></div>';
  // 미배정 교양·창체 안내
  const u1l=unLib(1),u2l=unLib(2),u1c=unCh(1),u2c=unCh(2);
  if(u1l||u2l||u1c||u2c){
    html+=`<div class="desc" style="margin-top:8px;color:var(--amber)">⚠️ 아직 교과군에 배정되지 않은 시수 —
      교양: 1학기 ${u1l}h · 2학기 ${u2l}h / 창체: 1학기 ${u1c}h · 2학기 ${u2c}h.
      아래에서 담당 교과군을 지정하면 해당 교과군의 교양·창체시수로 집계됩니다.</div>`;
  }
  html+='</div>';

  // 이동 가능한 수업: 창체·기타 블록 + 교양 과목
  const grpSel=groupSelectHTML;
  html+=`<div class="card"><h2>🧩 창체·기타 블록 편성</h2>
    <div class="desc">각 블록을 담당할 교과군을 선택하세요. 선택 즉시 위 표와 상단 현황이 갱신됩니다. (미집계=어느 교과군에도 넣지 않음 · 블록 추가/삭제는 ① 과목·분반 설정에서)</div>
    <div class="tbl-scroll"><table><tr><th>학년</th><th>적용</th><th>블록명</th><th class="num">시수</th><th>편성 교과군</th></tr>`;
  for(const b of state.blocks){
    html+=`<tr><td>${b.grade}학년</td><td>${b.sem===0?'연간':b.sem+'학기'}</td><td>${esc(b.name)}</td><td class="num"><b>${b.hours}h</b></td>
      <td>${grpSel(b.group, `app.setBlockGroup('${b.id}',this.value)`)}</td></tr>`;
  }
  html+='</table></div></div>';

  const libs=state.subjects.filter(s=>s.tGroup==='교양'||effGroup(s)==='교양'||state.subjGroupOverride[s.id]);
  html+=`<div class="card"><h2>🎓 교양 등 과목 재편성</h2>
    <div class="desc">교양 과목(및 재배치된 과목)을 다른 교과군에서 담당하도록 옮길 수 있습니다. 원래 교과군과 다르면 강조됩니다.</div>
    <div class="tbl-scroll"><table><tr><th>학년·학기</th><th>과목</th><th class="num">필요시수</th><th>원래</th><th>편성 교과군</th></tr>`;
  if(!libs.length) html+='<tr><td colspan="5" class="small">재편성 대상 과목이 없습니다.</td></tr>';
  for(const s of libs){
    const moved=state.subjGroupOverride[s.id] && state.subjGroupOverride[s.id]!==s.tGroup;
    html+=`<tr class="${moved?'okrow':''}"><td>${s.grade}학년 ${s.sem}학기</td><td><b>${esc(s.name)}</b></td>
      <td class="num">${reqHours(s)}h</td><td><span class="small">${s.tGroup}</span></td>
      <td>${grpSel(effGroup(s), `app.setSubjGroup('${s.id}',this.value)`)}</td></tr>`;
  }
  html+='</table></div></div>';

  document.getElementById('tab-macro').innerHTML=html;
}

/* ---------- actions ---------- */
const app = {
  setCapacity(v){ state.capacity=Math.max(5,parseInt(v)||DATA.defaultCapacity); save(); render(); },
  clearOverrides(){ if(confirm('모든 과목의 분반수를 자동 계산값으로 되돌릴까요?')){ state.secOverride={}; save(); render(); } },
  // 거시편성
  setMacroTarget(v){ const n=parseFloat(v); state.macroTarget = isNaN(n)?null:Math.max(1,n); save(); render(); },
  setBlockGroup(id,g){ const b=state.blocks.find(x=>x.id===id); if(b){ b.group=g; save(); render(); } },
  setBlockName(id,v){ const b=state.blocks.find(x=>x.id===id); if(b){ b.name=v.trim()||b.name; save(); render(); } },
  setBlockHours(id,v){ const b=state.blocks.find(x=>x.id===id); if(b){ b.hours=Math.max(0,parseInt(v)||0); save(); render(); } },
  setBlockSem(id,v){ const b=state.blocks.find(x=>x.id===id); if(b){ b.sem=parseInt(v); save(); render(); } },
  addBlock(grade,sem){
    const name=(prompt('추가할 창체·기타 블록명을 입력하세요.\n예: 창체(자율), 국제이해, 진학정보')||'').trim();
    if(!name) return;
    const hours=Math.max(0,parseInt(prompt('시수(주당 시간)를 입력하세요.','1'))||0);
    state.blocks.push({id:'nb'+(state.nextBid++), grade, name, hours, group:'창체', sem});
    save(); render();
  },
  deleteBlock(id){
    const b=state.blocks.find(x=>x.id===id); if(!b) return;
    if(!confirm(`'${b.name}' 블록을 삭제할까요?`)) return;
    state.blocks=state.blocks.filter(x=>x.id!==id);
    save(); render();
  },
  setSubjGroup(id,g){
    const s=subjById[id]; if(!s) return;
    if(g===s.tGroup) delete state.subjGroupOverride[id];
    else state.subjGroupOverride[id]=g;
    save(); render();
  },
  // 과목 추가·수정·삭제
  addSubject(grade,sem){
    const name=(prompt('추가할 과목명을 입력하세요.')||'').trim();
    if(!name) return;
    let g=(prompt('교과군을 입력하세요.\n('+BASE_GROUPS.filter(x=>x!=='기타').join(' / ')+')','국어')||'').trim();
    if(!g) return;
    const kind=confirm('학교 지정과목입니까?\n[확인]=지정(전교생)  /  [취소]=선택과목')?'지정':'선택';
    let count=null, selGroup='';
    if(kind==='선택'){
      count=parseInt(prompt('신청 인원을 입력하세요.','0'))||0;
      selGroup=(prompt('선택그룹 표기(예: A, B, D … 비워도 됩니다).','')||'').trim();
    }
    const credit=parseFloat(prompt('학점(주당 시수)을 입력하세요.','3'))||3;
    const id='ns'+(state.nextSid++);
    state.subjects.push({id, name, credit, kwGroup:g, tGroup:g, kind, sem, grade, count, selGroup});
    state.editSubject=id;
    save(); render();
  },
  editSubject(id){ state.editSubject = state.editSubject===id?null:id; save(); render(); },
  saveSubject(id){
    const s=subjById[id]; if(!s) return;
    const gv=id=>document.getElementById(id+'-'+s.id);
    const name=gv('es-name').value.trim(); if(!name){ alert('과목명을 입력하세요.'); return; }
    s.name=name;
    const g=gv('es-grp').value; s.tGroup=g; s.kwGroup=g;
    if(state.subjGroupOverride[id]) delete state.subjGroupOverride[id];
    s.credit=parseFloat(gv('es-cr').value)||s.credit;
    s.kind=gv('es-kind').value;
    if(s.kind==='선택'){ s.count=parseInt(gv('es-cnt').value)||0; s.selGroup=gv('es-sg').value.trim(); }
    else { s.count=null; s.selGroup=''; }
    s.grade=parseInt(gv('es-gr').value); s.sem=parseInt(gv('es-sem').value);
    state.editSubject=null;
    save(); render();
  },
  deleteSubject(id){
    const s=subjById[id]; if(!s) return;
    const na=state.assignments.filter(a=>a.subjectId===id).length;
    let msg=`'${s.name}' 과목을 삭제할까요?`;
    if(na) msg+=`\n\n이 과목의 교사 배정 ${na}건도 함께 삭제됩니다.`;
    if(!confirm(msg)) return;
    state.subjects=state.subjects.filter(x=>x.id!==id);
    state.assignments=state.assignments.filter(a=>a.subjectId!==id);
    delete state.secOverride[id]; delete state.subjGroupOverride[id];
    if(state.pickSubject===id) state.pickSubject=null;
    if(state.editSubject===id) state.editSubject=null;
    save(); render();
  },
  setSections(sid,v){
    const s=subjById[sid]; const n=parseInt(v);
    if(isNaN(n)||n===autoSections(s)) delete state.secOverride[sid];
    else state.secOverride[sid]=Math.max(0,n);
    save(); render();
  },
  setFilter(g){ state.teacherFilter=g; save(); render(); },
  gotoGroup(g){
    state.tab='teachers';
    state.teacherFilter = state.teachers.some(t=>t.group===g) ? g : '전체';
    save(); render();
    window.scrollTo({top:0});
  },
  toggleTeacher(id){ state.openTeacher = state.openTeacher===id?null:id; save(); render(); },
  editTeacher(id){ state.pickSubject=null; state.showAllGroups=true; state.openTeacher=id; save(); render(); },
  addTeacher(){
    const name=(prompt('추가할 교사 이름을 입력하세요.')||'').trim();
    if(!name) return;
    let g=(prompt('교과군을 입력하세요.\n('+BASE_GROUPS.join(' / ')+')',
      state.teacherFilter!=='전체'?state.teacherFilter:'국어')||'').trim();
    if(!g) return;
    const id='nt'+(state.nextTid++);
    const order=Math.max(0,...state.teachers.map(t=>t.order||0))+1;
    state.teachers.push({id, order, group:g, name, note:''});
    if(state.teacherFilter!=='전체' && state.teacherFilter!==g) state.teacherFilter='전체';
    state.openTeacher=id;
    save(); render();
  },
  saveTeacher(id){
    const t=tById[id]; if(!t) return;
    const name=document.getElementById('tn-'+id).value.trim();
    const g=document.getElementById('tg-'+id).value;
    const note=document.getElementById('tnote-'+id).value.trim();
    if(!name){ alert('이름을 입력하세요.'); return; }
    t.name=name; t.group=g; t.note=note;
    save(); render();
  },
  deleteTeacher(id){
    const t=tById[id]; if(!t) return;
    const na=state.assignments.filter(a=>a.teacherId===id).length;
    const nx=state.extras.filter(x=>x.teacherId===id).length;
    let msg=`'${t.name}' 교사를 삭제할까요?`;
    if(na||nx) msg+=`\n\n이 교사의 과목 배정 ${na}건은 함께 삭제되고, 기타·창체 ${nx}건은 담당자 미지정으로 남습니다.`;
    if(!confirm(msg)) return;
    state.teachers=state.teachers.filter(x=>x.id!==id);
    state.assignments=state.assignments.filter(a=>a.teacherId!==id);
    state.extras.forEach(x=>{ if(x.teacherId===id) x.teacherId=''; });
    if(state.openTeacher===id) state.openTeacher=null;
    save(); render();
  },
  pickSubj(sid){
    if(state.pickSubject===sid){ state.pickSubject=null; state.showAllGroups=true; }
    else{
      state.pickSubject=sid;
      state.showAllGroups=false;   // 선택 시 해당 교과군만 표시
      const s=subjById[sid];
      state.teacherFilter = state.teachers.some(t=>t.group===effGroup(s)) ? effGroup(s) : '전체';
      state.openTeacher=null;
    }
    save(); render();
  },
  toggleGroups(){ state.showAllGroups=!state.showAllGroups; save(); render(); },
  rowClick(tid){
    if(state.pickSubject){
      const sid=state.pickSubject;
      const ex=state.assignments.find(a=>a.teacherId===tid&&a.subjectId===sid);
      if(ex) ex.sections+=1;
      else state.assignments.push({id:'a'+(state.nextId++), teacherId:tid, subjectId:sid, sections:1});
      const s=subjById[sid];
      if(assignedSections(sid)>=sections(s)){ state.pickSubject=null; state.showAllGroups=true; }  // 배정 완료 시 자동 해제·복원
      save(); render();
    } else app.toggleTeacher(tid);
  },
  addAssign(tid){
    const sid=document.getElementById('addsub-'+tid).value;
    const sec=Math.max(1,parseInt(document.getElementById('addsec-'+tid).value)||1);
    const ex=state.assignments.find(a=>a.teacherId===tid&&a.subjectId===sid);
    if(ex) ex.sections+=sec;
    else state.assignments.push({id:'a'+(state.nextId++), teacherId:tid, subjectId:sid, sections:sec});
    save(); render();
  },
  setAssignSections(aid,v){
    const a=state.assignments.find(x=>x.id===aid); if(!a) return;
    a.sections=Math.max(1,parseInt(v)||1); save(); render();
  },
  removeAssign(aid){ state.assignments=state.assignments.filter(a=>a.id!==aid); save(); render(); },
  addExtra(tid){
    const name=document.getElementById('addxname-'+tid).value.trim();
    const h=parseInt(document.getElementById('addxh-'+tid).value)||0;
    const sem=parseInt(document.getElementById('addxsem-'+tid).value);
    if(!name){ alert('기타 시수 명칭을 입력하세요.'); return; }
    state.extras.push({id:'e'+(state.nextId++), teacherId:tid, name, hours:h, sem, note:''});
    save(); render();
  },
  setExtraHours(xid,v){
    const x=state.extras.find(e=>e.id===xid); if(!x) return;
    x.hours=parseInt(v)||0; save(); render();
  },
  removeExtra(xid){ state.extras=state.extras.filter(e=>e.id!==xid); save(); render(); },
  exportJSON(){
    const blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='시수배정2027_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  },
  exportCSV(){
    let rows=[['교과군','이름','비고','1학기 배정내역','1학기 전공','1학기 비전공','1학기 교양','1학기 기타','1학기 계',
      '2학기 배정내역','2학기 전공','2학기 비전공','2학기 교양','2학기 기타','2학기 계']];
    for(const t of state.teachers){
      const det=sem=>state.assignments.filter(a=>a.teacherId===t.id&&subjById[a.subjectId].sem===sem)
        .map(a=>{const s=subjById[a.subjectId];return subjLabel(s)+'×'+a.sections+'('+a.sections*s.credit+'h)';})
        .concat(state.extras.filter(x=>x.teacherId===t.id&&(x.sem===0||x.sem===sem)).map(x=>x.name+'('+x.hours+'h)'))
        .join(' / ');
      const h1=teacherSemHours(t,1),h2=teacherSemHours(t,2);
      rows.push([t.group,t.name,t.note||'',det(1),h1.major,h1.non,h1.liberal,h1.extra,h1.total,
        det(2),h2.major,h2.non,h2.liberal,h2.extra,h2.total]);
    }
    const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download='교사별시수_2027.csv'; a.click();
  },
  resetAll(){
    if(confirm('모든 배정·설정을 초기화할까요? (되돌릴 수 없습니다)')){
      state=freshState(); save(); render();
    }
  }
};

/* import */
document.getElementById('importfile').addEventListener('change', ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const s=JSON.parse(r.result);
      if(!s.assignments||!s.extras) throw new Error('형식 오류');
      state=s; save(); render(); alert('가져오기 완료');
    }catch(e){ alert('JSON을 읽을 수 없습니다: '+e.message); } };
  r.readAsText(f); ev.target.value='';
});
/* nav & sem toggle */
document.querySelectorAll('nav button[data-tab]').forEach(b=>b.addEventListener('click',()=>{ state.tab=b.dataset.tab; save(); render(); }));
document.querySelectorAll('#semtoggle button').forEach(b=>b.addEventListener('click',()=>{ state.sem=+b.dataset.sem; save(); render(); }));

render();
</script>
</body>
</html>
